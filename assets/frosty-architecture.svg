<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc"><title id="title">Frosty Studio architecture</title><desc id="desc">A browser connects to Studio directly. An agent connects through the MCP companion. Studio routes work to separate image and video backends. Saved media and Trash persist on disk.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#9de6ed" stroke-width="1.5"/></marker></defs><rect width="1400" height="650" rx="24" fill="#0c1014"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="60" fill="#e7eef3" font-size="30" font-weight="700">One Studio. Separate render engines.</text><text x="48" y="95" fill="#8b9ba8" font-size="20">The companion speaks MCP. Studio owns the browser workflow. Engines load the models.</text><rect x="48" y="144" width="310" height="110" rx="14" fill="#11171d" stroke="#26313a"/><text x="71" y="181" fill="#e7eef3" font-size="24" font-weight="700">Browser</text><text x="71" y="215" fill="#a7b9c4" font-size="19">Image / Video workspace</text><rect x="48" y="319" width="310" height="110" rx="14" fill="#11171d" stroke="#26313a"/><text x="71" y="356" fill="#e7eef3" font-size="24" font-weight="700">Your agent</text><text x="71" y="390" fill="#a7b9c4" font-size="19">MCP-capable client</text><rect x="425" y="319" width="350" height="138" rx="14" fill="#11171d" stroke="#26313a"/><text x="448" y="356" fill="#e7eef3" font-size="24" font-weight="700">MCP companion</text><text x="448" y="390" fill="#a7b9c4" font-size="19">12 tools · no model loading</text><text x="448" y="418" fill="#a7b9c4" font-size="19">stdio or private :8891/mcp</text><rect x="425" y="144" width="350" height="122" rx="14" fill="#14282b" stroke="#537c80"/><text x="448" y="181" fill="#e7eef3" font-size="24" font-weight="700">Frosty Studio :8890</text><text x="448" y="215" fill="#a7b9c4" font-size="19">UI · proxy · jobs · galleries</text><rect x="990" y="144" width="362" height="135" rx="14" fill="#11171d" stroke="#26313a"/><text x="1013" y="181" fill="#e7eef3" font-size="24" font-weight="700">Image engine</text><text x="1013" y="215" fill="#a7b9c4" font-size="19">Qwen Image 2.1 + optional PE</text><text x="1013" y="243" fill="#a7b9c4" font-size="19">Own model files and GPU</text><rect x="990" y="319" width="362" height="135" rx="14" fill="#11171d" stroke="#26313a"/><text x="1013" y="356" fill="#e7eef3" font-size="24" font-weight="700">Video engine(s)</text><text x="1013" y="390" fill="#a7b9c4" font-size="19">Modular VL / optional Wan</text><text x="1013" y="418" fill="#a7b9c4" font-size="19">Separate models and GPU needs</text><path d="M358 197H417" fill="none" stroke="#9de6ed" stroke-width="2" marker-end="url(#arrow)"/><path d="M358 373H417" fill="none" stroke="#9de6ed" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 319V274" fill="none" stroke="#9de6ed" stroke-width="2" marker-end="url(#arrow)"/><path d="M775 200H982" fill="none" stroke="#9de6ed" stroke-width="2" marker-end="url(#arrow)"/><path d="M775 217H860V375H982" fill="none" stroke="#9de6ed" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="505" width="1304" height="100" rx="14" fill="#11171d" stroke="#26313a"/><text x="73" y="547" fill="#b9f3c6" font-size="24" font-weight="700">Saved media + metadata + recoverable Trash</text><text x="73" y="582" fill="#a7b9c4" font-size="20">Persist on disk. In-memory jobs and unfinished queues do not resume after restart.</text></g></svg>
