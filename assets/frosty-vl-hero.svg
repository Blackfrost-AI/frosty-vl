<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060f1e"/>
      <stop offset="0.55" stop-color="#0d2745"/>
      <stop offset="1" stop-color="#123a5c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.32" r="0.6">
      <stop offset="0" stop-color="#4fb8ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4fb8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bfe4ff"/>
    </linearGradient>
    <g id="flake" stroke="#8fd3ff" stroke-linecap="round">
      <g>
        <line x1="0" y1="-52" x2="0" y2="52"/>
        <line x1="0" y1="-52" x2="-13" y2="-38"/><line x1="0" y1="-52" x2="13" y2="-38"/>
        <line x1="0" y1="-26" x2="-11" y2="-15"/><line x1="0" y1="-26" x2="11" y2="-15"/>
        <line x1="0" y1="52" x2="-13" y2="38"/><line x1="0" y1="52" x2="13" y2="38"/>
        <line x1="0" y1="26" x2="-11" y2="15"/><line x1="0" y1="26" x2="11" y2="15"/>
      </g>
      <use href="#h" transform="rotate(60)"/>
    </g>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- big frost snowflake, right side -->
  <g transform="translate(1000,300) scale(2.6)" stroke="#3f79a8" stroke-opacity="0.35" stroke-width="3" fill="none">
    <g id="arms">
      <line x1="0" y1="0" x2="0" y2="-60"/>
      <line x1="0" y1="-60" x2="-14" y2="-44"/><line x1="0" y1="-60" x2="14" y2="-44"/>
      <line x1="0" y1="-34" x2="-12" y2="-22"/><line x1="0" y1="-34" x2="12" y2="-22"/>
    </g>
    <use href="#arms" transform="rotate(60)"/><use href="#arms" transform="rotate(120)"/>
    <use href="#arms" transform="rotate(180)"/><use href="#arms" transform="rotate(240)"/>
    <use href="#arms" transform="rotate(300)"/>
  </g>

  <!-- small scattered flakes -->
  <g fill="#8fd3ff" opacity="0.5">
    <circle cx="120" cy="120" r="3"/><circle cx="240" cy="520" r="2.5"/>
    <circle cx="70" cy="360" r="2"/><circle cx="600" cy="90" r="2.5"/>
    <circle cx="1180" cy="560" r="3"/><circle cx="520" cy="560" r="2"/>
  </g>

  <!-- text block -->
  <text x="96" y="150" fill="#7fb8e6" font-size="26" letter-spacing="8" font-weight="600">B L A C K F R O S T</text>

  <text x="90" y="300" fill="url(#title)" font-size="132" font-weight="800" letter-spacing="-2">❄ Frosty VL</text>

  <text x="96" y="360" fill="#bfe4ff" font-size="40" font-weight="500">Universal, multi-engine video Studio.</text>

  <!-- feature chips -->
  <g font-size="24" font-weight="600">
    <rect x="96" y="398" rx="19" width="196" height="38" fill="#0e2c4d" stroke="#2f6da0"/>
    <text x="118" y="423" fill="#cfeaff">weights-free</text>
    <rect x="308" y="398" rx="19" width="272" height="38" fill="#0e2c4d" stroke="#2f6da0"/>
    <text x="330" y="423" fill="#cfeaff">bring your own model</text>
    <rect x="596" y="398" rx="19" width="252" height="38" fill="#0e2c4d" stroke="#2f6da0"/>
    <text x="618" y="423" fill="#cfeaff">video + native audio</text>
  </g>

  <!-- petty pill -->
  <rect x="96" y="486" rx="24" width="560" height="48" fill="#08304f" stroke="#5bc0ff" stroke-opacity="0.6"/>
  <text x="122" y="517" fill="#e8f6ff" font-size="26" font-weight="700">Runs everywhere. No territory restrictions. ❄</text>

  <text x="96" y="600" fill="#5f8fb8" font-size="22" font-weight="500">github.com/Blackfrost-AI  ·  Qwen3-VL · Wan 2.2 · more engines to come  ·  bring your own weights</text>
</svg>
