<text x="69" y="260" fill="#9de6ed" font-size="34">Qwen Image 2.1, front and center.</text>
<text x="69" y="311" fill="#b6c5ce" font-size="25">Create images. Build scenes. Connect your agent.</text>
<text x="69" y="366" fill="#8b9ba8" font-size="21">One project. Dedicated engines. A consistent workspace.</text>
