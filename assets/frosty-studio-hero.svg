<rect x="64" y="455" width="478" height="185" rx="16" fill="#11171d" stroke="#26313a"/><text x="90" y="495" fill="#9de6ed" font-size="16" letter-spacing="3">01 / IMAGE</text><text x="90" y="536" fill="#e7eef3" font-size="27" font-weight="700">Bring your references.</text><text x="90" y="576" fill="#a7b9c4" font-size="20">10 inputs · edit · masks · RGBA</text><text x="90" y="607" fill="#a7b9c4" font-size="20">Official Qwen prompt enhancement</text><rect x="561" y="455" width="478" height="185" rx="16" fill="#11171d" stroke="#26313a"/><text x="587" y="495" fill="#9de6ed" font-size="16" letter-spacing="3">02 / VIDEO</text><text x="587" y="536" fill="#e7eef3" font-size="27" font-weight="700">Direct the next scene.</text><text x="587" y="576" fill="#a7b9c4" font-size="20">Queued clips · 2–8 scene movies</text><text x="587" y="607" fill="#a7b9c4" font-size="20">Opening frames · recoverable gallery</text><rect x="1058" y="455" width="478" height="185" rx="16" fill="#11171d" stroke="#26313a"/><text x="1084" y="495" fill="#9de6ed" font-size="16" letter-spacing="3">03 / AGENTS</text><text x="1084" y="536" fill="#e7eef3" font-size="27" font-weight="700">Make it part of your flow.</text><text x="1084" y="576" fill="#a7b9c4" font-size="20">12 MCP tools · stdio or private HTTP</text><text x="1084" y="607" fill="#a7b9c4" font-size="20">Generate · inspect · download · restore</text><text x="67" y="683" fill="#8b9ba8" font-size="17">Your models. Your machine. Your creative process.</text><text x="1532" y="683" text-anchor="end" fill="#b9f3c6" font-size="17">IMAGE + VL + MCP</text></g></svg>
